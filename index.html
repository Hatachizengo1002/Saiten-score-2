<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大喜利リアルタイム採点システム デモ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Meiryo", sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #ffffff;
            padding: 0.75rem 1.5rem;
            border-bottom: 2px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.1rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: 0.05em;
        }

        .tab-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .tab-btn {
            background-color: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
            padding: 0.4rem 1rem;
            border-radius: 0.375rem;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
        }

        main {
            flex: 1;
            padding: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        /* --- ホスト/管理 2カラムレイアウト --- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        /* スクリーン投影エリア (OBSクロップ枠) */
        .screen-box {
            background-color: #ffffff;
            border: 3px solid #0f172a;
            border-radius: 0.5rem;
            padding: 2rem 1rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 320px;
            position: relative;
        }

        .screen-tag {
            position: absolute;
            top: 0.5rem;
            left: 0.5rem;
            background-color: #e2e8f0;
            color: #475569;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: 0.25rem;
        }

        .screen-label {
            font-size: 1.1rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }

        .screen-score {
            font-size: 7rem;
            font-weight: 900;
            line-height: 1;
            color: #dc2626; /* 赤字表記 */
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
        }

        /* 管理パネル */
        .admin-panel {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .card {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 0.5rem;
            padding: 1.25rem;
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: 800;
            color: #0f172a;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }

        /* 設定フォーム */
        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #475569;
        }

        .form-group input, .form-group select {
            padding: 0.5rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.375rem;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* モード選択 */
        .mode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.75rem;
        }

        .mode-card {
            background-color: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 0.375rem;
            padding: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-card.selected {
            border-color: #0f172a;
            background-color: #f8fafc;
        }

        .mode-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: #0f172a;
        }

        .mode-desc {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 0.25rem;
        }

        /* 各審査員の点数表示 */
        .judges-status {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 0.75rem;
        }

        .judge-badge {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 0.5rem;
            border-radius: 0.375rem;
            text-align: center;
        }

        .judge-name {
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
        }

        .judge-score {
            font-size: 1.4rem;
            font-weight: 800;
            color: #0f172a;
            margin-top: 0.2rem;
        }

        .judge-score.excluded {
            color: #94a3b8;
            text-decoration: line-through;
            opacity: 0.6;
        }

        .judge-score.waiting {
            color: #cbd5e1;
            font-size: 0.9rem;
        }

        /* コントロールボタン */
        .control-panel {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        .btn {
            background-color: #0f172a;
            color: #ffffff;
            border: none;
            padding: 0.6rem 1.25rem;
            font-size: 0.875rem;
            font-weight: 700;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #0f172a;
        }

        /* --- ゲスト画面 --- */
        .guest-container {
            max-width: 450px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 0.5rem;
            padding: 1.5rem;
        }

        .score-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin: 1.5rem 0;
        }

        .score-btn {
            background-color: #ffffff;
            border: 2px solid #cbd5e1;
            color: #0f172a;
            font-size: 2rem;
            font-weight: 800;
            padding: 1.75rem 0;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .score-btn.active {
            background-color: #0f172a;
            border-color: #0f172a;
            color: #ffffff;
        }

        .status-msg {
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: #64748b;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">大喜利 リアルタイム採点システム</div>
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchView('host')">ホスト・管理画面</button>
            <button class="tab-btn" onclick="switchView('guest')">ゲスト画面（審査員スマホ）</button>
        </div>
    </header>

    <main>
        <!-- ホスト / 管理画面 -->
        <section id="host-view" class="view-section active">
            <div class="dashboard-grid">
                
                <!-- 左：スクリーン投影・クロップ対象エリア -->
                <div class="screen-box">
                    <div class="screen-tag">PROJECTION AREA / OBS CROP</div>
                    <div class="screen-label">TOTAL SCORE</div>
                    <div class="screen-score" id="total-score-display">-</div>
                </div>

                <!-- 右：管理者コントロールエリア -->
                <div class="admin-panel">
                    
                    <!-- 設定パラメータ -->
                    <div class="card">
                        <div class="card-title">基本設定</div>
                        <div class="config-grid">
                            <div class="form-group">
                                <label>審査員人数</label>
                                <input type="number" id="judge-count-input" value="6" min="3" max="20" onchange="updateSettings()">
                            </div>
                            <div class="form-group">
                                <label>ルール1: 最高点カット数</label>
                                <input type="number" id="cut-high-input" value="1" min="0" max="5" onchange="updateSettings()">
                            </div>
                            <div class="form-group">
                                <label>ルール1: 最低点カット数</label>
                                <input type="number" id="cut-low-input" value="1" min="0" max="5" onchange="updateSettings()">
                            </div>
                        </div>
                    </div>

                    <!-- 採点モード選択 -->
                    <div class="card">
                        <div class="card-title">採点モード選択</div>
                        <div class="mode-grid">
                            <div class="mode-card selected" id="mode1-card" onclick="selectMode(1)">
                                <div class="mode-title">第1ルール：カット＆掛け算</div>
                                <div class="mode-desc" id="mode1-desc">最高点と最低点をカットした積（全員満点は100点）</div>
                            </div>
                            <div class="mode-card" id="mode2-card" onclick="selectMode(2)">
                                <div class="mode-title">第2ルール：単純加点</div>
                                <div class="mode-desc">全員の点を単純合計</div>
                            </div>
                            <div class="mode-card" id="mode3-card" onclick="selectMode(3)">
                                <div class="mode-title">第3ルール：全員掛け算</div>
                                <div class="mode-desc">全員の点をそのまま掛け合わせ</div>
                            </div>
                        </div>
                    </div>

                    <!-- 各審査員のリアルタイム状態 -->
                    <div class="card">
                        <div class="card-title">審査員 入力状況（管理者用）</div>
                        <div class="judges-status" id="judges-list"></div>
                    </div>

                    <!-- コントロール -->
                    <div class="control-panel">
                        <button class="btn btn-secondary" onclick="resetScores()">点数をリセット</button>
                        <button class="btn" onclick="fillRandomScores()">デモ用：ランダム入力</button>
                    </div>

                </div>
            </div>
        </section>

        <!-- ゲスト画面（審査員用） -->
        <section id="guest-view" class="view-section">
            <div class="guest-container">
                <div class="card-title">審査員端末</div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label>審査員番号</label>
                    <select id="judge-id-select" onchange="onJudgeChange()"></select>
                </div>

                <div class="card-title">点数選択</div>
                <div class="score-buttons">
                    <button class="score-btn" id="score-btn-1" onclick="submitScore(1)">1</button>
                    <button class="score-btn" id="score-btn-2" onclick="submitScore(2)">2</button>
                    <button class="score-btn" id="score-btn-3" onclick="submitScore(3)">3</button>
                </div>

                <div class="status-msg" id="guest-status-msg">点数を選択してください</div>
            </div>
        </section>
    </main>

    <script>
        // システム状態
        let currentMode = 1;
        let judgeCount = 6;
        let cutHighCount = 1;
        let cutLowCount = 1;
        let scores = Array(6).fill(null);

        function switchView(view) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));

            if (view === 'host') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('host-view').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('guest-view').classList.add('active');
                updateGuestSelectOptions();
                updateGuestUI();
            }
        }

        function updateSettings() {
            const newCount = parseInt(document.getElementById('judge-count-input').value) || 3;
            cutHighCount = parseInt(document.getElementById('cut-high-input').value) || 0;
            cutLowCount = parseInt(document.getElementById('cut-low-input').value) || 0;

            if (newCount !== judgeCount) {
                judgeCount = newCount;
                scores = Array(judgeCount).fill(null);
            }

            document.getElementById('mode1-desc').textContent = 
                `最高点${cutHighCount}名・最低点${cutLowCount}名カット後の積（全員満点は100点）`;

            updateHostDisplay();
        }

        function selectMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-card').forEach(card => card.classList.remove('selected'));
            document.getElementById(`mode${mode}-card`).classList.add('selected');
            updateHostDisplay();
        }

        function submitScore(score) {
            const judgeIdx = parseInt(document.getElementById('judge-id-select').value);
            scores[judgeIdx] = score;
            updateGuestUI();
            updateHostDisplay();
            document.getElementById('guest-status-msg').textContent = `審査員 ${judgeIdx + 1} として ${score} 点を送信しました`;
        }

        function onJudgeChange() {
            updateGuestUI();
            document.getElementById('guest-status-msg').textContent = '点数を選択してください';
        }

        function updateGuestSelectOptions() {
            const selectEl = document.getElementById('judge-id-select');
            selectEl.innerHTML = '';
            for (let i = 0; i < judgeCount; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `審査員 ${i + 1}`;
                selectEl.appendChild(opt);
            }
        }

        function updateGuestUI() {
            const selectEl = document.getElementById('judge-id-select');
            if (!selectEl.value) return;
            const judgeIdx = parseInt(selectEl.value);
            const currentScore = scores[judgeIdx];

            [1, 2, 3].forEach(val => {
                const btn = document.getElementById(`score-btn-${val}`);
                if (currentScore === val) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function calculateTotal() {
            if (scores.includes(null)) {
                return null;
            }

            if (currentMode === 1) {
                // 全員3点なら100点
                if (scores.every(s => s === 3)) {
                    return { total: 100, excludedIndices: [] };
                }

                let indexedScores = scores.map((val, idx) => ({ val, idx }));
                indexedScores.sort((a, b) => a.val - b.val);

                let excludedIndices = [];
                
                // 最低点のカット
                for (let i = 0; i < cutLowCount && i < indexedScores.length; i++) {
                    excludedIndices.push(indexedScores[i].idx);
                }
                
                // 最高点のカット
                for (let i = 0; i < cutHighCount && (indexedScores.length - 1 - i) >= cutLowCount; i++) {
                    excludedIndices.push(indexedScores[indexedScores.length - 1 - i].idx);
                }

                let total = 1;
                let count = 0;
                indexedScores.forEach(item => {
                    if (!excludedIndices.includes(item.idx)) {
                        total *= item.val;
                        count++;
                    }
                });

                if (count === 0) total = 0; // 全員カットされた場合の安全策

                return { total, excludedIndices };

            } else if (currentMode === 2) {
                let total = scores.reduce((sum, val) => sum + val, 0);
                return { total, excludedIndices: [] };

            } else if (currentMode === 3) {
                let total = scores.reduce((product, val) => product * val, 1);
                return { total, excludedIndices: [] };
            }
        }

        function updateHostDisplay() {
            const listEl = document.getElementById('judges-list');
            listEl.innerHTML = '';

            const result = calculateTotal();

            scores.forEach((s, idx) => {
                const badge = document.createElement('div');
                badge.className = 'judge-badge';

                const name = document.createElement('div');
                name.className = 'judge-name';
                name.textContent = `審査員 ${idx + 1}`;

                const scoreEl = document.createElement('div');
                if (s === null) {
                    scoreEl.className = 'judge-score waiting';
                    scoreEl.textContent = '未';
                } else {
                    scoreEl.className = 'judge-score';
                    if (result && result.excludedIndices.includes(idx)) {
                        scoreEl.classList.add('excluded');
                    }
                    scoreEl.textContent = `${s}点`;
                }

                badge.appendChild(name);
                badge.appendChild(scoreEl);
                listEl.appendChild(badge);
            });

            const totalDisplay = document.getElementById('total-score-display');
            if (result !== null) {
                totalDisplay.textContent = result.total;
            } else {
                totalDisplay.textContent = '-';
            }
        }

        function resetScores() {
            scores = Array(judgeCount).fill(null);
            updateHostDisplay();
            updateGuestUI();
            document.getElementById('guest-status-msg').textContent = 'リセットしました';
        }

        function fillRandomScores() {
            scores = scores.map(() => Math.floor(Math.random() * 3) + 1);
            updateHostDisplay();
            updateGuestUI();
        }

        // 初期化
        updateSettings();
    </script>
</body>
</html>
