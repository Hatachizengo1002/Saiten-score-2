<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大喜利リアルタイム採点システム</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Meiryo", sans-serif; }
        body { background-color: #f1f5f9; color: #0f172a; min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: #ffffff; padding: 0.75rem 1.5rem; border-bottom: 2px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.1rem; font-weight: 800; color: #0f172a; letter-spacing: 0.05em; }
        .tab-buttons { display: flex; gap: 0.5rem; }
        .tab-btn { background-color: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; padding: 0.4rem 1rem; border-radius: 0.375rem; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
        .tab-btn.active { background-color: #0f172a; color: #ffffff; border-color: #0f172a; }
        main { flex: 1; padding: 1.5rem; max-width: 1400px; margin: 0 auto; width: 100%; }
        .view-section { display: none; }
        .view-section.active { display: block; }

        .dashboard-grid { display: grid; grid-template-columns: 480px 1fr; gap: 1.5rem; }
        @media (max-width: 1000px) { .dashboard-grid { grid-template-columns: 1fr; } }

        .screen-box { background-color: #ffffff; border: 3px solid #0f172a; border-radius: 0.5rem; padding: 1.5rem; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 420px; position: relative; }
        .screen-tag { position: absolute; top: 0.5rem; left: 0.5rem; background-color: #e2e8f0; color: #475569; font-size: 0.7rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 0.25rem; }
        .screen-mode-toggle { position: absolute; top: 0.5rem; right: 0.5rem; display: flex; gap: 0.25rem; }
        .screen-mode-btn { font-size: 0.7rem; padding: 0.25rem 0.5rem; border: 1px solid #0f172a; background: #ffffff; font-weight: 700; cursor: pointer; border-radius: 0.25rem; }
        .screen-mode-btn.active { background: #0f172a; color: #ffffff; }
        .screen-player-name { font-size: 1.5rem; font-weight: 800; color: #475569; margin-top: 1rem; }
        .screen-score { font-size: 7.5rem; font-weight: 900; line-height: 1; color: #dc2626; font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; margin: 0.5rem 0; }
        .screen-timer { font-size: 2rem; font-weight: 800; color: #0f172a; letter-spacing: 0.05em; }
        .chart-container { width: 100%; height: 300px; display: none; }

        .admin-panel { display: flex; flex-direction: column; gap: 1rem; }
        .card { background-color: #ffffff; border: 1px solid #cbd5e1; border-radius: 0.5rem; padding: 1rem 1.25rem; }
        .card-title { font-size: 0.85rem; font-weight: 800; color: #0f172a; border-bottom: 2px solid #f1f5f9; padding-bottom: 0.4rem; margin-bottom: 0.75rem; display: flex; justify-content: space-between; align-items: center; }

        .timer-display { font-size: 2.2rem; font-weight: 900; color: #0f172a; font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; }
        .flex-row { display: flex; align-items: center; gap: 0.75rem; }

        .player-input-group { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
        .player-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .player-chip { background: #f8fafc; border: 1px solid #cbd5e1; padding: 0.4rem 0.8rem; border-radius: 0.375rem; font-size: 0.85rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; }
        .player-chip.active { background: #0f172a; color: #ffffff; border-color: #0f172a; }
        .player-chip .total-pts { background: #dc2626; color: #ffffff; padding: 0.1rem 0.4rem; border-radius: 0.25rem; font-size: 0.75rem; }

        .config-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.75rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.2rem; }
        .form-group label { font-size: 0.75rem; font-weight: 700; color: #475569; }
        .form-group input, .form-group select { padding: 0.4rem; border: 1px solid #cbd5e1; border-radius: 0.375rem; font-size: 0.85rem; font-weight: 600; }

        .mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.5rem; }
        .mode-card { background-color: #ffffff; border: 2px solid #e2e8f0; border-radius: 0.375rem; padding: 0.5rem; cursor: pointer; transition: all 0.2s; }
        .mode-card.selected { border-color: #0f172a; background-color: #f8fafc; }
        .mode-title { font-size: 0.85rem; font-weight: 800; color: #0f172a; }

        .judges-status { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 0.5rem; }
        .judge-badge { background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 0.4rem; border-radius: 0.375rem; text-align: center; position: relative; }
        .judge-name { font-size: 0.7rem; font-weight: 700; color: #64748b; }
        .judge-status-tag { font-size: 0.65rem; font-weight: 800; color: #0284c7; }
        .judge-status-tag.taken { color: #dc2626; }
        .judge-score { font-size: 1.2rem; font-weight: 800; color: #0f172a; }
        .judge-score.excluded { color: #94a3b8; text-decoration: line-through; opacity: 0.6; }
        .judge-score.waiting { color: #cbd5e1; font-size: 0.85rem; }
        .btn-kick { position: absolute; top: 0.2rem; right: 0.2rem; background: none; border: none; font-size: 0.75rem; cursor: pointer; color: #94a3b8; }

        .btn { background-color: #0f172a; color: #ffffff; border: none; padding: 0.5rem 1rem; font-size: 0.85rem; font-weight: 700; border-radius: 0.375rem; cursor: pointer; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-secondary { background-color: #e2e8f0; color: #0f172a; }
        .btn-danger { background-color: #dc2626; color: #ffffff; }

        .guest-container { max-width: 450px; margin: 0 auto; background-color: #ffffff; border: 1px solid #cbd5e1; border-radius: 0.5rem; padding: 1.5rem; }
        .seat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin-bottom: 1.5rem; }
        .seat-btn { background: #f8fafc; border: 2px solid #cbd5e1; padding: 1rem; border-radius: 0.5rem; font-weight: 800; font-size: 0.9rem; cursor: pointer; text-align: center; }
        .seat-btn.taken { background: #e2e8f0; border-color: #cbd5e1; color: #94a3b8; cursor: not-allowed; }
        .seat-btn.my-seat { background: #0f172a; border-color: #0f172a; color: #ffffff; }

        .score-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin: 1.5rem 0; }
        .score-btn { background-color: #ffffff; border: 2px solid #cbd5e1; color: #0f172a; font-size: 2rem; font-weight: 800; padding: 1.75rem 0; border-radius: 0.5rem; cursor: pointer; }
        .score-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .score-btn.active { background-color: #0f172a; border-color: #0f172a; color: #ffffff; }

        .auth-lock-card { max-width: 400px; margin: 3rem auto; background: #ffffff; border: 2px solid #0f172a; border-radius: 0.5rem; padding: 2rem; text-align: center; }
    </style>
</head>
<body>

    <header>
        <div class="logo">大喜利 リアルタイム採点システム</div>
        <div class="tab-buttons">
            <button class="tab-btn active" id="tab-btn-guest" onclick="switchView('guest')">審査員画面</button>
            <button class="tab-btn" id="tab-btn-host" onclick="switchView('host')">管理画面 (代表者用)</button>
        </div>
    </header>

    <main>
        <!-- 審査員画面 -->
        <section id="guest-view" class="view-section active">
            <div class="guest-container">
                <div class="card-title">審査員 枠を選択（先着順）</div>
                <div class="seat-grid" id="seat-grid-container"></div>

                <div class="card-title">点数選択</div>
                <div class="score-buttons">
                    <button class="score-btn" id="score-btn-1" onclick="submitScore(1)" disabled>1</button>
                    <button class="score-btn" id="score-btn-2" onclick="submitScore(2)" disabled>2</button>
                    <button class="score-btn" id="score-btn-3" onclick="submitScore(3)" disabled>3</button>
                </div>

                <div class="status-msg" id="guest-status-msg">空いている審査員番号を選択してください</div>
            </div>
        </section>

        <!-- 管理画面 -->
        <section id="host-view" class="view-section">
            <div id="admin-auth-box" class="auth-lock-card">
                <div style="font-size: 1.1rem; font-weight: 800; margin-bottom: 0.5rem;">代表者・管理用ロック</div>
                <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1.5rem;">管理画面を開くには管理者パスワードを入力してください</p>
                <div style="display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1rem;">
                    <input type="password" id="admin-pass-input" placeholder="パスワード (初期: 9999)" style="padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 0.375rem; text-align: center; font-size: 1rem; width: 180px;">
                    <button class="btn" onclick="checkAdminPassword()">解除</button>
                </div>
                <div id="admin-pass-msg" style="font-size: 0.8rem; color: #dc2626;"></div>
            </div>

            <div id="admin-dashboard-content" class="dashboard-grid" style="display: none;">
                <div class="screen-box">
                    <div class="screen-tag">PROJECTION AREA</div>
                    <div class="screen-mode-toggle">
                        <button class="screen-mode-btn active" id="btn-show-score" onclick="toggleScreenDispla
