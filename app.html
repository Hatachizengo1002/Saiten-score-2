<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大喜利リアルタイム採点システム</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Meiryo", sans-serif; }
        body { background-color: #f1f5f9; color: #0f172a; min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: #ffffff; padding: 0.75rem 1.5rem; border-bottom: 2px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.1rem; font-weight: 800; color: #0f172a; letter-spacing: 0.05em; }
        .tab-buttons { display: flex; gap: 0.5rem; }
        .tab-btn { background-color: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; padding: 0.4rem 1rem; border-radius: 0.375rem; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
        .tab-btn.active { background-color: #0f172a; color: #ffffff; border-color: #0f172a; }
        main { flex: 1; padding: 1.5rem; max-width: 1400px; margin: 0 auto; width: 100%; }
        .view-section { display: none; }
        .view-section.active { display: block; }

        .dashboard-grid { display: grid; grid-template-columns: 480px 1fr; gap: 1.5rem; }
        @media (max-width: 1000px) { .dashboard-grid { grid-template-columns: 1fr; } }

        .screen-box { background-color: #ffffff; border: 3px solid #0f172a; border-radius: 0.5rem; padding: 1.5rem; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 420px; position: relative; }
        .screen-tag { position: absolute; top: 0.5rem; left: 0.5rem; background-color: #e2e8f0; color: #475569; font-size: 0.7rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 0.25rem; }
        .screen-mode-toggle { position: absolute; top: 0.5rem; right: 0.5rem; display: flex; gap: 0.25rem; }
        .screen-mode-btn { font-size: 0.7rem; padding: 0.25rem 0.5rem; border: 1px solid #0f172a; background: #ffffff; font-weight: 700; cursor: pointer; border-radius: 0.25rem; }
        .screen-mode-btn.active { background: #0f172a; color: #ffffff; }
        .screen-player-name { font-size: 1.5rem; font-weight: 800; color: #475569; margin-top: 1rem; }
        .screen-score { font-size: 7.5rem; font-weight: 900; line-height: 1; color: #dc2626; font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; margin: 0.5rem 0; }
        .screen-timer { font-size: 2rem; font-weight: 800; color: #0f172a; letter-spacing: 0.05em; }
        .chart-container { width: 100%; height: 300px; display: none; }

        .admin-panel { display: flex; flex-direction: column; gap: 1rem; }
        .card { background-color: #ffffff; border: 1px solid #cbd5e1; border-radius: 0.5rem; padding: 1rem 1.25rem; }
        .card-title { font-size: 0.85rem; font-weight: 800; color: #0f172a; border-bottom: 2px solid #f1f5f9; padding-bottom: 0.4rem; margin-bottom: 0.75rem; display: flex; justify-content: space-between; align-items: center; }

        .timer-display { font-size: 2.2rem; font-weight: 900; color: #0f172a; font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; }
        .flex-row { display: flex; align-items: center; gap: 0.75rem; }

        .player-input-group { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
        .player-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .player-chip { background: #f8fafc; border: 1px solid #cbd5e1; padding: 0.4rem 0.8rem; border-radius: 0.375rem; font-size: 0.85rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; }
        .player-chip.active { background: #0f172a; color: #ffffff; border-color: #0f172a; }
        .player-chip .total-pts { background: #dc2626; color: #ffffff; padding: 0.1rem 0.4rem; border-radius: 0.25rem; font-size: 0.75rem; }

        .config-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.75rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.2rem; }
        .form-group label { font-size: 0.75rem; font-weight: 700; color: #475569; }
        .form-group input, .form-group select { padding: 0.4rem; border: 1px solid #cbd5e1; border-radius: 0.375rem; font-size: 0.85rem; font-weight: 600; }

        .mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.5rem; }
        .mode-card { background-color: #ffffff; border: 2px solid #e2e8f0; border-radius: 0.375rem; padding: 0.5rem; cursor: pointer; transition: all 0.2s; }
        .mode-card.selected { border-color: #0f172a; background-color: #f8fafc; }
        .mode-title { font-size: 0.85rem; font-weight: 800; color: #0f172a; }

        .judges-status { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 0.5rem; }
        .judge-badge { background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 0.4rem; border-radius: 0.375rem; text-align: center; position: relative; }
        .judge-name { font-size: 0.7rem; font-weight: 700; color: #64748b; }
        .judge-status-tag { font-size: 0.65rem; font-weight: 800; color: #0284c7; }
        .judge-status-tag.taken { color: #dc2626; }
        .judge-score { font-size: 1.2rem; font-weight: 800; color: #0f172a; }
        .judge-score.excluded { color: #94a3b8; text-decoration: line-through; opacity: 0.6; }
        .judge-score.waiting { color: #cbd5e1; font-size: 0.85rem; }
        .btn-kick { position: absolute; top: 0.2rem; right: 0.2rem; background: none; border: none; font-size: 0.75rem; cursor: pointer; color: #94a3b8; }

        .btn { background-color: #0f172a; color: #ffffff; border: none; padding: 0.5rem 1rem; font-size: 0.85rem; font-weight: 700; border-radius: 0.375rem; cursor: pointer; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-secondary { background-color: #e2e8f0; color: #0f172a; }
        .btn-danger { background-color: #dc2626; color: #ffffff; }

        .guest-container { max-width: 450px; margin: 0 auto; background-color: #ffffff; border: 1px solid #cbd5e1; border-radius: 0.5rem; padding: 1.5rem; }
        .seat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin-bottom: 1.5rem; }
        .seat-btn { background: #f8fafc; border: 2px solid #cbd5e1; padding: 1rem; border-radius: 0.5rem; font-weight: 800; font-size: 0.9rem; cursor: pointer; text-align: center; }
        .seat-btn.taken { background: #e2e8f0; border-color: #cbd5e1; color: #94a3b8; cursor: not-allowed; }
        .seat-btn.my-seat { background: #0f172a; border-color: #0f172a; color: #ffffff; }

        .score-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin: 1.5rem 0; }
        .score-btn { background-color: #ffffff; border: 2px solid #cbd5e1; color: #0f172a; font-size: 2rem; font-weight: 800; padding: 1.75rem 0; border-radius: 0.5rem; cursor: pointer; }
        .score-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .score-btn.active { background-color: #0f172a; border-color: #0f172a; color: #ffffff; }
    </style>
</head>
<body>

    <header>
        <div class="logo">大喜利 リアルタイム採点システム</div>
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchView('host')">ホスト・管理画面</button>
            <button class="tab-btn" onclick="switchView('guest')">ゲスト画面（審査員スマホ）</button>
        </div>
    </header>

    <main>
        <section id="host-view" class="view-section active">
            <div class="dashboard-grid">
                
                <div class="screen-box">
                    <div class="screen-tag">PROJECTION AREA</div>
                    <div class="screen-mode-toggle">
                        <button class="screen-mode-btn active" id="btn-show-score" onclick="toggleScreenDisplay('score')">リアルタイム採点</button>
                        <button class="screen-mode-btn" id="btn-show-chart" onclick="toggleScreenDisplay('chart')">最終結果（グラフ）</button>
                    </div>

                    <div id="screen-score-view" style="width:100%;">
                        <div class="screen-player-name" id="screen-player-display">回答者：未選択</div>
                        <div class="screen-score" id="total-score-display">-</div>
                        <div class="screen-timer" id="screen-timer-display">03:00</div>
                    </div>

                    <div class="chart-container" id="screen-chart-view">
                        <canvas id="resultChart"></canvas>
                    </div>
                </div>

                <div class="admin-panel">
                    <div class="card">
                        <div class="card-title">
                            <span>試合タイマー</span>
                            <span id="timer-status-badge" style="font-size:0.75rem; color:#0284c7;">READY</span>
                        </div>
                        <div class="flex-row">
                            <div class="timer-display" id="admin-timer-display">03:00</div>
                            <div class="form-group" style="width: 80px;">
                                <label>時間(分)</label>
                                <input type="number" id="timer-min-input" value="3" min="1" max="60">
                            </div>
                            <button class="btn" id="btn-timer-start" onclick="toggleTimer()">スタート</button>
                            <button class="btn btn-secondary" onclick="resetTimer()">リセット</button>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-title">回答者選択 & 総合スコア</div>
                        <div class="player-input-group">
                            <input type="text" id="new-player-name" placeholder="回答者名を入力" style="flex:1; padding:0.4rem; border:1px solid #cbd5e1; border-radius:0.375rem;">
                            <button class="btn" onclick="addPlayer()">追加</button>
                        </div>
                        <div class="player-list" id="player-chips-container"></div>
                    </div>

                    <div class="card">
                        <div class="card-title">ルール＆パラメータ</div>
                        <div class="config-grid" style="margin-bottom:0.75rem;">
                            <div class="form-group">
                                <label>審査員人数</label>
                                <input type="number" id="judge-count-input" value="6" min="1" max="20" onchange="updateSettings()">
                            </div>
                            <div class="form-group">
                                <label>最高点カット</label>
                                <input type="number" id="cut-high-input" value="1" min="0" max="5" onchange="updateSettings()">
                            </div>
                            <div class="form-group">
                                <label>最低点カット</label>
                                <input type="number" id="cut-low-input" value="1" min="0" max="5" onchange="updateSettings()">
                            </div>
                        </div>

                        <div class="mode-grid">
                            <div class="mode-card selected" id="mode1-card" onclick="selectMode(1)">
                                <div class="mode-title">第1：カット＆積</div>
                            </div>
                            <div class="mode-card" id="mode2-card" onclick="selectMode(2)">
                                <div class="mode-title">第2：単純加点</div>
                            </div>
                            <div class="mode-card" id="mode3-card" onclick="selectMode(3)">
                                <div class="mode-title">第3：全員掛け算</div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-title">審査員 枠確保状況 & 採点</div>
                        <div class="judges-status" id="judges-list"></div>
                    </div>

                    <div class="control-panel flex-row">
                        <button class="btn btn-secondary" onclick="resetCurrentAnswerScores()">現在の判定をクリア</button>
                        <button class="btn" onclick="commitAnswerScore()">得点を回答者に加算確定</button>
                        <button class="btn btn-danger" onclick="finishMatchAndSaveHistory()">試合を終了して結果保存</button>
                    </div>
                </div>
            </div>
        </section>

        <section id="guest-view" class="view-section">
            <div class="guest-container">
                <div class="card-title">審査員 枠を選択（先着順）</div>
                <div class="seat-grid" id="seat-grid-container"></div>

                <div class="card-title">点数選択</div>
                <div class="score-buttons">
                    <button class="score-btn" id="score-btn-1" onclick="submitScore(1)" disabled>1</button>
                    <button class="score-btn" id="score-btn-2" onclick="submitScore(2)" disabled>2</button>
                    <button class="score-btn" id="score-btn-3" onclick="submitScore(3)" disabled>3</button>
                </div>

                <div class="status-msg" id="guest-status-msg">空いている審査員番号を選択してください</div>
            </div>
        </section>
    </main>

    <script>
        let currentMode = 1;
        let judgeCount = 6;
        let cutHighCount = 1;
        let cutLowCount = 1;
        let scores = Array(6).fill(null);
        let takenSeats = Array(6).fill(false);

        let mySeatIdx = null;

        let players = [];
        let activePlayerId = null;

        let timerInterval = null;
        let timerSeconds = 180;
        let isTimerRunning = false;
        let resultChart = null;

        function switchView(view) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));

            if (view === 'host') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('host-view').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('guest-view').classList.add('active');
                renderSeatGrid();
                updateGuestUI();
            }
        }

        function renderSeatGrid() {
            const container = document.getElementById('seat-grid-container');
            container.innerHTML = '';

            for (let i = 0; i < judgeCount; i++) {
                const btn = document.createElement('button');
                btn.className = 'seat-btn';
                
                if (mySeatIdx === i) {
                    btn.classList.add('my-seat');
                    btn.textContent = `審査員 ${i + 1} (あなた)`;
                    btn.onclick = () => releaseSeat();
                } else if (takenSeats[i]) {
                    btn.classList.add('taken');
                    btn.textContent = `審査員 ${i + 1} (参加中)`;
                    btn.disabled = true;
                } else {
                    btn.textContent = `審査員 ${i + 1} (空き)`;
                    btn.onclick = () => claimSeat(i);
                }
                container.appendChild(btn);
            }
        }

        function claimSeat(idx) {
            if (takenSeats[idx]) return;
            if (mySeatIdx !== null) takenSeats[mySeatIdx] = false;

            mySeatIdx = idx;
            takenSeats[idx] = true;

            renderSeatGrid();
            updateGuestUI();
            updateHostDisplay();
            document.getElementById('guest-status-msg').textContent = `審査員 ${idx + 1} として着席しました。点数を選択できます`;
        }

        function releaseSeat() {
            if (mySeatIdx !== null) {
                takenSeats[mySeatIdx] = false;
                scores[mySeatIdx] = null;
                mySeatIdx = null;
            }
            renderSeatGrid();
            updateGuestUI();
            updateHostDisplay();
            document.getElementById('guest-status-msg').textContent = '枠を解除しました。番号を選び直してください';
        }

        function kickSeat(idx) {
            if (mySeatIdx === idx) mySeatIdx = null;
            takenSeats[idx] = false;
            scores[idx] = null;
            renderSeatGrid();
            updateGuestUI();
            updateHostDisplay();
        }

        function toggleTimer() {
            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                document.getElementById('btn-timer-start').textContent = '再開';
                document.getElementById('timer-status-badge').textContent = 'PAUSED';
            } else {
                isTimerRunning = true;
                document.getElementById('btn-timer-start').textContent = '一時停止';
                document.getElementById('timer-status-badge').textContent = 'MATCHING';
                timerInterval = setInterval(() => {
                    if (timerSeconds > 0) {
                        timerSeconds--;
                        updateTimerDisplays();
                    } else {
                        clearInterval(timerInterval);
                        isTimerRunning = false;
                        document.getElementById('btn-timer-start').textContent = '終了';
                        document.getElementById('timer-status-badge').textContent = 'TIME UP';
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            const mins = parseInt(document.getElementById('timer-min-input').value) || 3;
            timerSeconds = mins * 60;
            document.getElementById('btn-timer-start').textContent = 'スタート';
            document.getElementById('timer-status-badge').textContent = 'READY';
            updateTimerDisplays();
        }

        function updateTimerDisplays() {
            const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
            const s = String(timerSeconds % 60).padStart(2, '0');
            const str = `${m}:${s}`;
            document.getElementById('admin-timer-display').textContent = str;
            document.getElementById('screen-timer-display').textContent = str;
        }

        function addPlayer() {
            const input = document.getElementById('new-player-name');
            const name = input.value.trim();
            if (!name) return;

            const player = { id: Date.now(), name, totalScore: 0 };
            players.push(player);
            input.value = '';
            
            if (activePlayerId === null) {
                selectPlayer(player.id);
            } else {
                renderPlayerChips();
            }
        }

        function selectPlayer(id) {
            activePlayerId = id;
            renderPlayerChips();
            const player = players.find(p => p.id === id);
            document.getElementById('screen-player-display').textContent = player ? `回答者：${player.name}` : '回答者：未選択';
            resetCurrentAnswerScores();
        }

        function renderPlayerChips() {
            const container = document.getElementById('player-chips-container');
            container.innerHTML = '';
            players.forEach(p => {
                const chip = document.createElement('div');
                chip.className = `player-chip ${p.id === activePlayerId ? 'active' : ''}`;
                chip.onclick = () => selectPlayer(p.id);
                chip.innerHTML = `<span>${p.name}</span><span class="total-pts">${p.totalScore}pt</span>`;
                container.appendChild(chip);
            });
        }

        function commitAnswerScore() {
            if (activePlayerId === null) {
                alert('回答者を選択してください');
                return;
            }
            const res = calculateTotal();
            if (!res) {
                alert('全員の採点が完了していません');
                return;
            }

            const player = players.find(p => p.id === activePlayerId);
            if (player) {
                player.totalScore += res.total;
                renderPlayerChips();
                resetCurrentAnswerScores();
            }
        }

        function updateSettings() {
            const newCount = parseInt(document.getElementById('judge-count-input').value) || 1;
            cutHighCount = parseInt(document.getElementById('cut-high-input').value) || 0;
            cutLowCount = parseInt(document.getElementById('cut-low-input').value) || 0;

            if (newCount !== judgeCount) {
                judgeCount = newCount;
                scores = Array(judgeCount).fill(null);
                takenSeats = Array(judgeCount).fill(false);
                mySeatIdx = null;
            }
            updateHostDisplay();
        }

        function selectMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-card').forEach(card => card.classList.remove('selected'));
            document.getElementById(`mode${mode}-card`).classList.add('selected');
            updateHostDisplay();
        }

        function submitScore(score) {
            if (mySeatIdx === null) return;
            scores[mySeatIdx] = score;
            updateGuestUI();
            updateHostDisplay();
            document.getElementById('guest-status-msg').textContent = `審査員 ${mySeatIdx + 1} として ${score} 点を送信しました`;
        }

        function updateGuestUI() {
            const hasSeat = (mySeatIdx !== null);
            [1, 2, 3].forEach(val => {
                const btn = document.getElementById(`score-btn-${val}`);
                btn.disabled = !hasSeat;
                if (hasSeat && scores[mySeatIdx] === val) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function calculateTotal() {
            if (scores.includes(null)) return null;

            if (currentMode === 1) {
                if (scores.every(s => s === 3)) return { total: 100, excludedIndices: [] };

                let indexedScores = scores.map((val, idx) => ({ val, idx }));
                indexedScores.sort((a, b) => a.val - b.val);

                let excludedIndices = [];
                for (let i = 0; i < cutLowCount && i < indexedScores.length; i++) {
                    excludedIndices.push(indexedScores[i].idx);
                }
                for (let i = 0; i < cutHighCount && (indexedScores.length - 1 - i) >= cutLowCount; i++) {
                    excludedIndices.push(indexedScores[indexedScores.length - 1 - i].idx);
                }

                let total = 1;
                let count = 0;
                indexedScores.forEach(item => {
                    if (!excludedIndices.includes(item.idx)) {
                        total *= item.val;
                        count++;
                    }
                });

                return { total: count === 0 ? 0 : total, excludedIndices };

            } else if (currentMode === 2) {
                return { total: scores.reduce((sum, val) => sum + val, 0), excludedIndices: [] };
            } else if (currentMode === 3) {
                return { total: scores.reduce((product, val) => product * val, 1), excludedIndices: [] };
            }
        }

        function updateHostDisplay() {
            const listEl = document.getElementById('judges-list');
            listEl.innerHTML = '';

            const result = calculateTotal();

            scores.forEach((s, idx) => {
                const badge = document.createElement('div');
                badge.className = 'judge-badge';
                
                const kickBtn = document.createElement('button');
                kickBtn.className = 'btn-kick';
                kickBtn.textContent = '✕';
                kickBtn.title = 'この枠を解放';
                kickBtn.onclick = () => kickSeat(idx);

                const name = document.createElement('div');
                name.className = 'judge-name';
                name.textContent = `審査員 ${idx + 1}`;

                const tag = document.createElement('div');
                tag.className = `judge-status-tag ${takenSeats[idx] ? 'taken' : ''}`;
                tag.textContent = takenSeats[idx] ? '参加中' : '空き';

                const scoreEl = document.createElement('div');
                if (s === null) {
                    scoreEl.className = 'judge-score waiting';
                    scoreEl.textContent = '未';
                } else {
                    scoreEl.className = 'judge-score';
                    if (result && result.excludedIndices.includes(idx)) {
                        scoreEl.classList.add('excluded');
                    }
                    scoreEl.textContent = `${s}点`;
                }

                badge.appendChild(kickBtn);
                badge.appendChild(name);
                badge.appendChild(tag);
                badge.appendChild(scoreEl);
                listEl.appendChild(badge);
            });

            document.getElementById('total-score-display').textContent = result !== null ? result.total : '-';
        }

        function resetCurrentAnswerScores() {
            scores = Array(judgeCount).fill(null);
            updateHostDisplay();
            updateGuestUI();
        }

        function toggleScreenDisplay(mode) {
            const scoreView = document.getElementById('screen-score-view');
            const chartView = document.getElementById('screen-chart-view');
            const btnScore = document.getElementById('btn-show-score');
            const btnChart = document.getElementById('btn-show-chart');

            if (mode === 'score') {
                scoreView.style.display = 'block';
                chartView.style.display = 'none';
                btnScore.classList.add('active');
                btnChart.classList.remove('active');
            } else {
                scoreView.style.display = 'none';
                chartView.style.display = 'block';
                btnScore.classList.remove('active');
                btnChart.classList.add('active');
                renderResultChart();
            }
        }

        function renderResultChart() {
            const ctx = document.getElementById('resultChart').getContext('2d');
            const labels = players.map(p => p.name);
            const data = players.map(p => p.totalScore);

            if (resultChart) resultChart.destroy();

            resultChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels.length ? labels : ['回答者なし'],
                    datasets: [{
                        label: '合計得点 (pt)',
                        data: data.length ? data : [0],
                        backgroundColor: '#dc2626',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, ticks: { font: { weight: 'bold' } } },
                        x: { ticks: { font: { weight: 'bold', size: 14 } } }
                    }
                }
            });
        }

        function finishMatchAndSaveHistory() {
            if (!confirm('試合を終了して全回答者のスコアを最終結果（グラフ）に反映しますか？')) return;
            toggleScreenDisplay('chart');
        }

        updateSettings();
        resetTimer();
    </script>
</body>
</html>
